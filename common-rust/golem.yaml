manifestVersion: 1.5.0

componentTemplates:
  common-env:
    env:
      DATABASE_TYPE: postgresql
      DATABASE_HOST: "{{ DATABASE_HOST }}"
      DATABASE_USER: "{{ DATABASE_USER }}"
      DATABASE_DB: "{{ DATABASE_DB }}"
      DATABASE_PASSWORD: "{{ DATABASE_PASSWORD }}"
      DATABASE_INIT: "true"
      DATABASE_QUERY_LOG: "false"
    presets:
      debug:
        env:
          RUST_LOG: debug
          OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"
          JOURNAI_LLM_MOCK: "{{ JOURNAI_LLM_MOCK }}"
          JOURNAI_LLM_MODEL: "xiaomi/mimo-v2-flash:free"
      release:
        env:
          RUST_LOG: info
          OPENROUTER_API_KEY: "{{ OPENROUTER_API_KEY }}"
          JOURNAI_LLM_MOCK: "{{ JOURNAI_LLM_MOCK }}"
          JOURNAI_LLM_MODEL: "perplexity/sonar-pro"
          JOURNAI_LLM_ENTRIES_LIMIT: "3000"

customCommands:
  cargo-clean:
  - command: cargo clean
