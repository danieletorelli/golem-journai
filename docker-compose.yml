services:
  golem:
    image: golem
    build:
      context: .
      dockerfile: Dockerfile.downloader
      pull: true
      args:
        GOLEM_VERSION: ${GOLEM_VERSION:-1.4.2}
        GOLEM_ARCH: ${GOLEM_ARCH:-aarch64-unknown-linux-gnu}
    container_name: golem
    ports:
      - "9006:9006"
      - "9881:9881"

  postgres:
    image: postgres:alpine
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: journai
    volumes:
      - data:/var/lib/postgresql
    ports:
      - "5432:5432"
    command: postgres -c log_statement=all -c log_destination=stderr

volumes:
  data:
