[workspace]
resolver = "2"
members = ["components-rust/*", "common-rust/*"]

[profile.release]
opt-level = "s"
lto = true

[workspace.dependencies]
golem-rust = { version = "2.0.0", features = ["export_golem_agentic"] }
golem-ai-llm = "0.5.0"
golem-ai-llm-openrouter = "0.5.0"

# Advanced HTTP client, alternative of wstd::http
# golem-wasi-http = { version = "0.1.0", features = ["json"] }

log = { version = "0.4.29", features = ["kv"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toon-format = { version = "0.5", default-features = false }
wstd = { version = "=0.6.5", features = ["default", "json"] }
