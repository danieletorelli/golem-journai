name: CI

on:
  push:
    tags: [ 'v*.*.*' ]
    branches: [ '**' ]
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:
    inputs:
      golemversion:
        description: Golem version
        type: choice
        required: false
        default: 1.5.0
        options:
          - latest
          - master
          - 1.5.0
      debugmode:
        description: Run tests in debug mode
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always
  GOLEM_VERSION: ${{ github.event.inputs.golemversion != '' && github.event.inputs.golemversion || '1.5.0' }}
  GOLEM_PRESET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debugmode == 'true' && 'debug' || 'release' }}
  CARGO_TEST_FLAGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debugmode != 'true' && '--release' || '' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - name: Install protobuf
        if: env.GOLEM_VERSION == 'master'
        uses: arduino/setup-protoc@v3
      - name: Install golem-cli
        run: |
          if [[ "${{ env.GOLEM_VERSION }}" == "master" ]]
          then
            cargo install --git https://github.com/golemcloud/golem-cli golem-cli &&
            sudo mv ~/.cargo/bin/golem-cli /usr/local/bin &&
            echo "golem-cli built from source"
          elif [[ "${{ env.GOLEM_VERSION }}" == "latest" ]]
          then
            curl -Ssf -L -o golem-cli https://github.com/golemcloud/golem-cli/releases/latest/download/golem-cli-x86_64-unknown-linux-gnu &&
            chmod +x golem-cli &&
            sudo mv golem-cli /usr/local/bin/ &&
            echo "golem-cli installed from latest git release"
          else
            curl -Ssf -L -o golem-cli https://github.com/golemcloud/golem/releases/download/v${{ env.GOLEM_VERSION }}/golem-cli-x86_64-unknown-linux-gnu &&
            chmod +x golem-cli &&
            sudo mv golem-cli /usr/local/bin/ &&
            echo "golem-cli v${{ env.GOLEM_VERSION }} installed from registry"
          fi
          if ! command -v golem-cli &> /dev/null; then exit 1; fi
      - name: Install golem
        run: |
          if [[ "${{ env.GOLEM_VERSION }}" == "master" ]]
          then
            cargo install --git https://github.com/golemcloud/golem-cli golem &&
            sudo mv ~/.cargo/bin/golem /usr/local/bin &&
            echo "golem built from source"
          elif [[ "${{ env.GOLEM_VERSION }}" == "latest" ]]
          then
            curl -Ssf -L -o golem https://github.com/golemcloud/golem-cli/releases/latest/download/golem-x86_64-unknown-linux-gnu &&
            chmod +x golem &&
            sudo mv golem /usr/local/bin/ &&
            echo "golem installed from latest git release"
          else
            curl -Ssf -L -o golem https://github.com/golemcloud/golem/releases/download/v${{ env.GOLEM_VERSION }}/golem-x86_64-unknown-linux-gnu &&
            chmod +x golem &&
            sudo mv golem /usr/local/bin/ &&
            echo "golem installed from v${{ env.GOLEM_VERSION }} git release"
          fi
          if ! command -v golem &> /dev/null; then exit 1; fi
      - name: Print version
        run: |
          echo "Golem CLI version: $(golem-cli --version | cut -d ' ' -f 2)"
          echo "Golem version: $(golem --version | cut -d ' ' -f 2)"
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.17.6
      - name: Install cargo-component
        run: cargo binstall --no-confirm cargo-component || true
      - name: Build components
        run: golem build --preset="${GOLEM_PRESET}" --yes
      - name: Test
        run: cargo test --all ${CARGO_TEST_FLAGS}
      - name: Clippy
        run: cargo clippy -- -Dwarnings
      - name: Start services
        env:
          GOLEM_ARCH: x86_64-unknown-linux-gnu
        run: docker compose up -d
      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9006 || true)
            if [ "$code" != "000" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not start in time" >&2
          exit 1
      - name: Deploy components
        env:
          JOURNAI_LLM_MOCK: "true"
          OPENROUTER_API_KEY: "dummy"
          DATABASE_HOST: "postgres"
          DATABASE_USER: "postgres"
          DATABASE_DB: "postgres"
          DATABASE_PASSWORD: "journai"
        run: golem deploy --environment local --preset="${GOLEM_PRESET}" --yes
      - name: Run E2E tests
        env:
          BASE_URL: http://journai.localhost:9006
          WAIT_TIMEOUT: "60"
        run: bash scripts/e2e.sh

  auto-merge:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: TimonVS/pr-labeler-action@v5.0.0
        with:
          configuration-path: .github/auto_label.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: "automerge,!WIP,!do-not-merge"
          MERGE_METHOD: squash
