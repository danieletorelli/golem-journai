# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.4.2/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.4.2/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

httpApi:
  definitions:
    journai-collector-api:
      version: '0.0.1'
      routes:
        - method: POST
          path: /collect/{hostname}
          binding:
            type: default
            componentName: journai:collector
            response: |
              let hostname: string = request.path.hostname;
              let collector = collector(hostname);
              let result = collector.collect(request.body);
              match result {
                ok(count) => { status: 200, body: { success: true, message: "Collected ${count} entries" } },
                err(insert-error(e)) => { status: 500, body: { success: false, message: "Collection failed: ${e}" } },
                err(fetch-error(e)) => { status: 500, body: { success: false, message: "Collection failed: ${e}" } },
                err(_) => { status: 500, body: { success: false, message: "Unexpected error" } },
              }
        - method: GET
          path: /entries/{hostname}
          binding:
            type: default
            componentName: journai:collector
            response: |
              let hostname: string = request.path.hostname;
              let collector = collector(hostname);
              let since: f64 = request.query.since;
              let priority: s8 = request.query.priority;
              let message_contains: string = request.query.contains;
              let since_filter: option<f64> = if since < 0 then none else some(since);
              let priority_filter: option<u8> = if priority < 0 then none else match priority {
                0s8 => some(0u8),
                1s8 => some(1u8),
                2s8 => some(2u8),
                3s8 => some(3u8),
                4s8 => some(4u8),
                5s8 => some(5u8),
                6s8 => some(6u8),
                7s8 => some(7u8),
                _ => none
              };
              let message_contains_filter: option<string> = if message_contains == "" then none else some(message_contains);
              let result = collector.get-entries(since_filter, priority_filter, message_contains_filter);
              let status = match result { ok((_, _)) => 200, _ => 500 };
              let success = match result { ok((_, _)) => true, _ => false };
              let results = match result { ok((e, c)) => some({ entries: e, count: c }), _ => none };
              let error = match result { err(fetch-error(e)) => some("Fetch error: ${e}"), err(insert-error(e)) => some("Insert error: ${e}"), err(_) => some("Unexpected error"), _ => none };
              { 
                status: status,
                body: {
                  success: success,
                  results: results,
                  filters: { since: since_filter, priority: priority_filter, contains: message_contains_filter },
                  error: error
                }
              }
        - method: GET
          path: /errors/{hostname}
          binding:
            type: default
            componentName: journai:collector
            response: |
              let hostname: string = request.path.hostname;
              let collector = collector(hostname);
              let result = collector.get-error-spikes();
              let status = match result { ok(_) => 200, _ => 500 };
              let success = match result { ok(_) => true, _ => false };
              let results = match result { ok(e) => some(e), _ => none };
              let error = match result { err(fetch-error(e)) => some("Fetch error: ${e}"), err(insert-error(e)) => some("Insert error: ${e}"), err(_) => some("Unexpected error"), _ => none };
              {
                status: status,
                body: {
                  success: success,
                  results: results,
                  error: error
                }
              }
  deployments:
    local:
      - domain: journai.localhost:9006
        definitions:
          - journai-collector-api

components:
  journai:collector:
    templates: rust, common-env

    # Component environment variables can reference system environment variables with minijinja syntax:
    #
    #   env:
    #     ENV_VAR_1: "{{ ENV_VAR_1 }}"
    #     RENAMED_VAR_2: "{{ ENV_VAR_2 }}"
    #     COMPOSED_VAR_3: "{{ ENV_VAR_3 }}-{{ ENV_VAR_4}}"
    #
    env:
    # LLM providers
    # -------------

    ## Common
    # GOLEM_LLM_LOG: "trace" # Optional, defaults to warn

    ## Anthropic
    # ANTHROPIC_API_KEY: "<KEY>"

    ## OpenAI
    # OPENAI_API_KEY: "<KEY>"

    ## OpenRouter
    # OPENROUTER_API_KEY: "<KEY>"

    ## Amazon Bedrock
    # AWS_ACCESS_KEY_ID: "<KEY>"
    # AWS_REGION: "<REGION>"
    # AWS_SECRET_ACCESS_KEY: "<KEY>"
    # AWS_SESSION_TOKEN: "<TOKEN>" # Optional

    ## Grok
    # XAI_API_KEY: "<KEY>"

    ## Ollama
    # GOLEM_OLLAMA_BASE_URL: "<URL>" # Optional, defaults to http://localhost:11434


    # Graph database providers
    # ------------------------

    ## ArangoDB
    # ARANGODB_HOST: "<HOST>"
    # ARANGODB_PORT: "<PORT>" # Optional, defaults to 8529
    # ARANGODB_USER: "<USER>"
    # ARANGODB_PASSWORD: "<PASS>"
    # ARANGO_DATABASE: "<DB>"

    ## JanusGraph
    # JANUSGRAPH_HOST: "<HOST>"
    # JANUSGRAPH_PORT: "<PORT>" # Optional, defaults to 8182
    # JANUSGRAPH_USER: "<USER>"
    # JANUSGRAPH_PASSWORD: "<PASS>"

    ## Neo4j
    # NEO4J_HOST: "<HOST>"
    # NEO4J_PORT: "<PORT>" # Optional, defaults to 7687
    # NEO4J_USER: "<USER>"
    # NEO4J_PASSWORD: "<PASS>"


    # Search providers
    # ----------------

    ## Common
    # GOLEM_SEARCH_LOG: "trace" # Optional, defaults to warn

    ## Algolia
    # ALGOLIA_APPLICATION_ID: "<ID>"
    # ALGOLIA_API_KEY: "<KEY>"

    ## ElasticSearch
    # ELASTICSEARCH_URL: "<URL>"
    # ELASTICSEARCH_USERNAME: "<USERNAME>"
    # ELASTICSEARCH_PASSWORD: "<PASSWORD>"
    # ELASTICSEARCH_API_KEY: "<API_KEY>"

    ## Meilisearch
    # MEILISEARCH_BASE_URL: "<URL>"
    # MEILISEARCH_API_KEY: "<KEY>"

    ## OpenSearch
    # OPENSEARCH_BASE_URL: "<URL>"
    # OPENSEARCH_USERNAME: "<USER>"
    # OPENSEARCH_PASSWORD: "<PASS>"
    # OPENSEARCH_API_KEY: "<KEY>"

    ## Typesense
    # TYPESENSE_BASE_URL: "<URL>"
    # TYPESENSE_API_KEY: "<KEY>"


    # Speech-to-text providers
    # ------------------------

    ## Common
    # STT_PROVIDER_LOG_LEVEL: "trace" # Optional, defaults to warn
    # STT_PROVIDER_MAX_RETRIES: "10" # Optional, defaults to 10

    ## AWS
    # AWS_REGION: "<REGION>"
    # AWS_ACCESS_KEY: "<KEY>"
    # AWS_SECRET_KEY: "<KEY>"
    # AWS_BUCKET_NAME: "<BUCKET>"

    ## Azure
    # AZURE_REGION: "<REGION>"
    # AZURE_SUBSCRIPTION_KEY: "<KEY>"

    ## Deepgram
    # DEEPGRAM_API_TOKEN: "<TOKEN>"
    # DEEPGRAM_ENDPOINT: "<URL>" # Optional

    ## Google
    # GOOGLE_LOCATION: ""
    # GOOGLE_BUCKET_NAME: ""
    # GOOGLE_APPLICATION_CREDENTIALS: "<CRED>" # or use the vars below
    # GOOGLE_PROJECT_ID: "<ID>"
    # GOOGLE_CLIENT_EMAIL: "<EMAIL>"
    # GOOGLE_PRIVATE_KEY: "<KEY>"

    ## Whisper
    # OPENAI_API_KEY: "<KEY>"


    # Video generation providers
    # --------------------------

    ## Kling
    # KLING_ACCESS_KEY: "<KEY>"
    # KLING_SECRET_KEY: "<KEY>"

    ## Runway
